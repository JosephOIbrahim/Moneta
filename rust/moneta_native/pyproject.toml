[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "moneta-native"
version = "0.1.0"
description = "Optional native seams for Moneta. Moneta runs without it; the Python path is the exact oracle."
requires-python = ">=3.11"
classifiers = ["Private :: Do Not Upload"]

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "moneta_native"
